# Decap CMS settings for the Silver Peak website editor (/admin/).
# Editors sign in with GitHub. Saved changes wait as drafts until someone
# clicks Publish, which commits to main and redeploys the site.

backend:
  name: github
  repo: silverpeakdesignbuild/silverpeak-website
  branch: main
  # Sign-in helper: the Cloudflare Worker in cms-auth/, on the silverpeakdesignbuild Cloudflare account.
  base_url: https://silverpeak-cms-auth.polished-flower-19e3.workers.dev
  auth_scope: public_repo
  squash_merges: true
  commit_messages:
    create: "Add {{collection}} “{{slug}}” (website editor)"
    update: "Update {{collection}} “{{slug}}” (website editor)"
    delete: "Delete {{collection}} “{{slug}}” (website editor)"
    uploadMedia: "Upload “{{path}}” (website editor)"
    deleteMedia: "Delete “{{path}}” (website editor)"

# On localhost, `npx decap-server` lets the editor work on local files without signing in.
local_backend: true

publish_mode: editorial_workflow

site_url: https://silverpeakdesignbuild.github.io/silverpeak-website/
display_url: https://silverpeakdesignbuild.github.io/silverpeak-website/
media_folder: src/assets
public_folder: /assets

